<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tesla — Claire's Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Claire's phone: a pixel-art map of the town in the game's own look (Mother-style bright
   pixels, ink outlines, cream panels with hard shadows, Press Start 2P), inside a phone shaped like
   a folded iPhone Duo (cover screen 1 : 1.45). It is the Tesla app: the car is parked at Claire's
   home, places can be looked up and previewed, but the battery is too low to drive anywhere.
   Opened with ?embed inside the handheld game, it sits on a transparent page and tells the game
   when to close (postMessage {type:"phone-close"}). */
:root {
  --ink: #222d35;
  --paper: #fffde6;
  --field: #07e66e;
  --violet: #7457e6;
  --gold: #ffe260;
  --muted: #68756e;
  --room: #e7e4e1;
  --room-2: #d5d0cc;
  --px: "Press Start 2P", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 50% 25%, var(--room) 0%, var(--room-2) 100%);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.stage { position: fixed; inset: 0; display: grid; place-items: center; }

/* ---------- phone ---------- */
.phone {
  width: 414px; height: 590px; border-radius: 54px; background: #121316; padding: 12px; position: relative;
  box-shadow: 0 0 0 2px #2b2d33, 0 0 0 4px #9a9ca3, 0 30px 60px rgba(30, 25, 30, .35);
  transform-origin: center;
}
.phone::before { content: ""; position: absolute; right: -6px; top: 150px; width: 4px; height: 70px; border-radius: 0 3px 3px 0; background: #8e9097; }
.phone::after { content: ""; position: absolute; left: -6px; top: 120px; width: 4px; height: 44px; border-radius: 3px 0 0 3px; background: #8e9097; box-shadow: 0 60px 0 #8e9097; }
.screen {
  position: relative; width: 390px; height: 566px; border-radius: 42px; overflow: hidden; overflow: clip;
  background: var(--field); isolation: isolate; font-family: var(--px); color: var(--ink);
}
.island { position: absolute; z-index: 50; top: 10px; left: 50%; width: 104px; height: 30px; margin-left: -52px; border-radius: 20px; background: #000; }

/* ---------- status bar ---------- */
.status {
  position: absolute; z-index: 40; top: 0; left: 0; right: 0; height: 50px; padding: 0 30px 0 40px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
  font: 10px/1 var(--px); color: var(--ink);
}
.status .icons { display: flex; align-items: center; gap: 6px; }
.status svg { shape-rendering: crispEdges; }

/* ---------- map ---------- */
#map { position: absolute; inset: 0; width: 390px; height: 566px; touch-action: none; cursor: grab; image-rendering: pixelated; }
#map.dragging { cursor: grabbing; }
.tags { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.tag {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 7px/1 var(--px); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); padding: 3px 4px 2px; box-shadow: 2px 2px 0 rgba(34,45,53,.55);
  transition: opacity .2s steps(3);
}
.tag.place { background: var(--gold); font-size: 8px; padding: 4px 5px 3px; transform: translate(-50%, 6px); }

/* ---------- pixel UI pieces ---------- */
.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.pbtn {
  width: 44px; height: 44px; padding: 0; border: 3px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.pbtn svg { width: 20px; height: 20px; shape-rendering: crispEdges; }
.pbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.pbtn.on { background: var(--gold); }
.topbar { position: absolute; z-index: 20; top: 56px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; }
.pill { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; font: 9px/1 var(--px); min-width: 0; padding: 0 10px; }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 2px; }
.pill .dot { width: 8px; height: 8px; background: var(--muted); flex: none; box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite; }
.pill.ready .dot { background: var(--field); animation: none; }
@keyframes blink { 50% { opacity: .2; } }
.side { position: absolute; z-index: 20; right: 16px; top: 112px; display: flex; flex-direction: column; gap: 10px; }
.side .pbtn { width: 40px; height: 40px; }

/* ---------- bottom sheet ---------- */
.sheet {
  position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; height: 264px; background: var(--paper);
  border-top: 3px solid var(--ink); box-shadow: 0 -3px 0 rgba(34,45,53,.25); display: flex; flex-direction: column;
  transition: height .3s steps(6);
}
.sheet.full { height: 470px; }
.sheet.card { height: 262px; }
.grab { flex: none; height: 24px; display: grid; place-items: center; cursor: pointer; }
.grab i { width: 48px; height: 6px; background: var(--ink); }
.pane { position: absolute; inset: 24px 0 0; display: flex; flex-direction: column; transition: opacity .2s steps(3); }
.pane[hidden] { display: flex; opacity: 0; pointer-events: none; }
.search { margin: 2px 16px 0; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #fff; border: 3px solid var(--ink); box-shadow: inset 3px 3px 0 #e8e4cc; }
.search svg { width: 18px; height: 18px; flex: none; shape-rendering: crispEdges; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--ink); font: 10px/1 var(--px); padding-top: 3px; }
.search input::placeholder { color: #9aa29c; }
.tabs[hidden] { display: none; }
.tabs { display: flex; gap: 10px; margin: 12px 16px 0; }
.tabs button { flex: 1; height: 34px; border: 3px solid var(--ink); background: #ece8cf; color: var(--muted); font: 9px/1 var(--px); cursor: pointer; padding-top: 3px; }
.tabs button.on { background: var(--violet); color: #fff; box-shadow: 3px 3px 0 var(--ink); }
.list { flex: 1; overflow-y: auto; padding: 4px 16px 18px; scrollbar-width: none; }
.list::-webkit-scrollbar { display: none; }
.group { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 7px/1 var(--px); margin: 14px 0 4px; }
.group::after { content: ""; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px); opacity: .35; }
.item { width: 100%; border: 0; background: none; color: inherit; text-align: left; display: flex; align-items: center; gap: 10px; padding: 8px 6px; cursor: pointer; }
.item:hover, .item:focus-visible { background: #f3eec9; outline: none; }
.item:active { background: var(--gold); }
.item .txt { flex: 1; min-width: 0; }
.item .name { font: 9px/1.4 var(--px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .addr { margin-top: 4px; color: var(--muted); font: 6px/1.4 var(--px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; width: 58px; height: 52px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 7px/1 var(--px); }
.chip svg { width: 14px; height: 18px; shape-rendering: crispEdges; }
.empty { color: var(--muted); font: 7px/1.8 var(--px); padding: 18px 0; text-align: center; }

/* place card */
.card-head { display: flex; align-items: flex-start; gap: 10px; margin: 4px 16px 0; }
.card-head .txt { flex: 1; min-width: 0; }
.card-head .name { font: 11px/1.4 var(--px); }
.card-head .addr { margin-top: 6px; color: var(--muted); font: 7px/1.5 var(--px); }
.card-head .pbtn { width: 34px; height: 34px; flex: none; box-shadow: 2px 2px 0 var(--ink); }
.card-head .pbtn svg { width: 14px; height: 14px; }
.facts { display: flex; gap: 10px; margin: 14px 16px 0; }
.fact { flex: 1; padding: 10px 8px 8px; }
.fact b { display: block; font: 11px/1 var(--px); }
.fact small { display: block; margin-top: 7px; color: var(--muted); font: 6px/1 var(--px); }
.note { margin: 14px 16px 0; color: var(--muted); font: 6px/1.6 var(--px); text-align: center; }

.pill .batt { width: 26px; height: 12px; flex: none; shape-rendering: crispEdges; }
.pill .batt.low { animation: blink 1s steps(2) infinite; }
.go {
  margin: 12px 16px 0; height: 42px; border: 3px solid var(--ink); background: var(--violet); color: #fff; font: 10px/1 var(--px);
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 3px;
}
.go:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.go svg { width: 14px; height: 14px; shape-rendering: crispEdges; margin-top: -3px; }
.warn { margin: 10px 16px 0; color: #c8324c; font: 6px/1.6 var(--px); text-align: center; }
.modal { position: absolute; z-index: 70; inset: 0; display: grid; place-items: center; background: rgba(34,45,53,.55); opacity: 0; pointer-events: none; transition: opacity .2s steps(3); }
.modal.show { opacity: 1; pointer-events: auto; }
.modal .panel { width: 300px; padding: 18px 16px 16px; text-align: center; transform: translateY(12px); transition: transform .25s steps(4); }
.modal.show .panel { transform: none; }
.modal h2 { margin: 12px 0 0; font: 12px/1.4 var(--px); color: #c8324c; }
.modal p { margin: 10px 0 0; font: 7px/1.8 var(--px); color: var(--muted); }
.modal .big-batt { width: 96px; height: 44px; shape-rendering: crispEdges; }
.modal .ok { margin: 16px auto 0; width: 120px; }
.shake { animation: shake .4s steps(8); }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
body.embed { background: transparent; }
body.embed .stage { cursor: pointer; }
body.embed .phone { cursor: default; }
.toast {
  position: absolute; z-index: 60; left: 50%; bottom: 282px; transform: translateX(-50%); padding: 9px 12px 7px; white-space: nowrap;
  font: 7px/1 var(--px); opacity: 0; transition: opacity .2s steps(3); pointer-events: none;
}
.toast.show { opacity: 1; }
/* ---------- unfolded on the game's bottom screen (?duo): the iPhone Duo opened into a landscape
   tablet (a 512x384 screen in its dark shell) laid over the screen, its edges allowed to run off a little;
   the map on the left and the sheet as a side panel on the right ---------- */
body.duo .stage { display: block; overflow: hidden; }
body.duo .phone { position: absolute; left: 0; top: 0; width: 536px; height: 408px; border-radius: 40px; transform-origin: 0 0;
  box-shadow: 0 0 0 2px #2b2d33, 0 0 0 4px #9a9ca3, 0 14px 30px rgba(20, 14, 22, .5); }
body.duo .phone::before { top: 96px; height: 54px; }
body.duo .phone::after { top: 80px; height: 36px; box-shadow: 0 46px 0 #8e9097; }
body.duo .island, body.duo .grab { display: none; }
body.duo .screen, body.duo #map { width: 512px; height: 384px; }
body.duo .screen { border-radius: 28px; }
body.duo .screen::after { content: ""; position: absolute; z-index: 45; left: 255px; top: 0; bottom: 0; width: 2px; background: rgba(34,45,53,.12); pointer-events: none; }  /* the fold */
body.duo .status { height: 26px; padding: 0 240px 0 14px; font-size: 8px; }
body.duo .topbar { top: 28px; left: 12px; right: 240px; gap: 8px; }
body.duo .topbar .pbtn, body.duo .topbar > div:last-child { width: 34px !important; height: 34px; }
body.duo .pill { height: 34px; font-size: 8px; }
body.duo .side { top: 74px; right: 240px; gap: 6px; }
body.duo .side .pbtn { width: 32px; height: 32px; }
body.duo .side .pbtn svg { width: 16px; height: 16px; }
body.duo .sheet, body.duo .sheet.full, body.duo .sheet.card { left: auto; top: 0; width: 228px; height: auto; border-top: 0; border-left: 3px solid var(--ink); box-shadow: -3px 0 0 rgba(34,45,53,.25); }
body.duo .pane { inset: 8px 0 0; }
body.duo .search { margin: 2px 10px 0; height: 36px; }
body.duo .tabs { margin: 8px 10px 0; gap: 6px; }
body.duo .tabs button { height: 28px; font-size: 7px; }
body.duo .list { padding: 2px 10px 10px; }
body.duo .item { padding: 6px 4px; }
body.duo .item .name { font-size: 8px; }
body.duo .chip { width: 48px; height: 42px; }
body.duo .card-head { margin: 4px 10px 0; }
body.duo .card-head .name { font-size: 9px; }
body.duo .facts { margin: 10px 10px 0; gap: 6px; }
body.duo .fact { padding: 8px 4px 6px; }
body.duo .fact b { font-size: 8px; }
body.duo .go { margin: 10px 10px 0; }
body.duo .warn, body.duo .note { margin: 8px 10px 0; }
body.duo .toast { left: 142px; bottom: 14px; }
body.duo .modal .panel { width: 280px; padding: 12px 14px 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
 <div class="phone" id="phone">
  <div class="screen" id="screen">
   <div class="island" aria-hidden="true"></div>
   <div class="status" aria-hidden="true">
    <span id="clock">10:21</span>
    <span class="icons">
     <svg width="18" height="12" viewBox="0 0 18 12" fill="#222d35"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10" opacity=".35"/><rect x="15" y="0" width="3" height="12" opacity=".35"/></svg>
     <svg width="16" height="12" viewBox="0 0 16 12" fill="#222d35"><rect x="6" y="9" width="4" height="3"/><rect x="3" y="6" width="10" height="2"/><rect x="0" y="2" width="16" height="2"/></svg>
     <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" fill="none" stroke="#222d35" stroke-width="2"/><rect x="3" y="3" width="13" height="6" fill="#222d35"/><rect x="23" y="4" width="3" height="4" fill="#222d35"/></svg>
    </span>
   </div>

   <canvas id="map" width="390" height="566" aria-label="Pixel map of the town"></canvas>
   <div class="tags" id="tags"></div>

   <div class="topbar">
    <button class="pbtn" id="back" aria-label="Back"><svg viewBox="0 0 10 10" fill="currentColor"><rect x="5" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="1" y="4" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="5" y="8" width="2" height="2"/></svg></button>

   </div>
   <div class="side">
    <button class="pbtn" id="share" aria-label="Share location"><svg viewBox="0 0 10 10" fill="currentColor"><rect x="6" y="1" width="1" height="1"/><rect x="6" y="2" width="2" height="1"/><rect x="2" y="3" width="7" height="2"/><rect x="6" y="5" width="2" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="2" y="5" width="2" height="4"/></svg></button>
    <button class="pbtn" id="recenter" aria-label="Find the car"><svg viewBox="0 0 10 10" fill="currentColor"><rect x="4" y="0" width="2" height="2"/><rect x="4" y="8" width="2" height="2"/><rect x="0" y="4" width="2" height="2"/><rect x="8" y="4" width="2" height="2"/><rect x="2" y="2" width="6" height="1"/><rect x="2" y="7" width="6" height="1"/><rect x="2" y="2" width="1" height="6"/><rect x="7" y="2" width="1" height="6"/><rect x="4" y="4" width="2" height="2"/></svg></button>

    <button class="pbtn" id="pinsBtn" aria-label="Show all places"><svg viewBox="0 0 10 10" fill="currentColor"><rect x="3" y="0" width="4" height="1"/><rect x="2" y="1" width="6" height="1"/><rect x="1" y="2" width="3" height="3"/><rect x="6" y="2" width="3" height="3"/><rect x="4" y="2" width="2" height="1"/><rect x="4" y="4" width="2" height="1"/><rect x="2" y="5" width="6" height="1"/><rect x="3" y="6" width="4" height="1"/><rect x="4" y="7" width="2" height="2"/></svg></button>

<script>
(() => {
/* =====================================================================
   The town, in map units (about 1000 x 1000). Roads are polylines through
   shared nodes, so the road network doubles as the routing graph.
   ===================================================================== */
const N = {
  b0:[60,520], b1:[260,500], b2:[420,560], c1:[500,560], b3:[620,560], b4:[800,520], b5:[970,545],
  m0:[620,90], m1:[620,240], m2:[620,380], m4:[620,720], m5:[620,930],
  p0:[90,380], pf:[270,380], p1:[380,380], p3:[880,380],
  e1:[880,240], e2:[880,90], f1:[250,700], f2:[240,930], r1:[380,215], k2:[800,720],
};
const ROADS = [
  { name:"Butterfield Ln", pts:["b0","b1","b2","c1","b3","b4","b5"] },
  { name:"Molar Ave",      pts:["m0","m1","m2","b3","m4","m5"] },
  { name:"Pearl St",       pts:["p0","pf","p1","m2","p3"] },
  { name:"Enamel Rd",      pts:["m1","e1"] },
  { name:"Hospital Dr",    pts:["e2","e1","p3"] },
  { name:"Floss Way",      pts:["pf","b1","f1","f2"] },
  { name:"Root Ct",        pts:["p1","r1"] },
  { name:"Crown Loop",     pts:["b4","k2","m4"] },
];
// roof colour, body colour, size in map pixels, and a small mark painted on the roof

  flyTo((minX + maxX) / 2 + 16 / BPU / z, (minY + maxY) / 2, z);
}

/* ---------- drag to pan, wheel / pinch to zoom, tap a building ---------- */
let drag = null, moved = false;
const pointers = new Map();
const pinchDist = () => { const p = [...pointers.values()]; return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, z: cam.z, dist: pinchDist() }; moved = false;
  cancelAnimationFrame(camAnim); canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (!drag || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) moved = true;
  if (pointers.size >= 2 && drag.dist) cam.z = Math.max(1, Math.min(3, drag.z * pinchDist() / drag.dist));
  else { cam.x = drag.cx - (e.clientX - drag.x) / phoneScale / cam.z / BPU; cam.y = drag.cy - (e.clientY - drag.y) / phoneScale / cam.z / BPU; }
  draw();
});
const endDrag = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size) return;
  canvas.classList.remove("dragging");
  if (!moved) tapAt(e);
  if (!ZOOMS.includes(cam.z)) flyTo(cam.x, cam.y, Math.round(cam.z), 200);   // settle on a whole zoom
  drag = null;
};
canvas.addEventListener("pointerup", endDrag); canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const i = ZOOMS.indexOf(Math.round(cam.z)), next = ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + (e.deltaY < 0 ? 1 : -1)))];
  if (next !== Math.round(cam.z)) flyTo(cam.x, cam.y, next, 220);
}, { passive: false });
function tapAt(e) {
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / phoneScale, y = (e.clientY - r.top) / phoneScale;
  let best = null, bd = 14 * Math.max(1, cam.z);
  for (const p of PLACES) { const s = toScreen(p.at[0], p.at[1]), d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; best = p; } }
  if (best) select(best.id);
}

/* ---------- street and place tags (pixel font, in screen space) ---------- */
const tagsEl = document.getElementById("tags");
const streetTags = ROADS.map(r => {
  const t = document.createElement("div"); t.className = "tag"; t.textContent = r.name.toUpperCase(); tagsEl.appendChild(t);
  return { t, pts: r.pts.map(k => nodes[k]) };
});
// The point on a road nearest (x, y), so each tag sits on the stretch of road in view.
const nearestOnRoad = (pts, x, y) => {
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const A = pts[i], B = pts[i + 1], dx = B.x - A.x, dy = B.y - A.y;
    const t = Math.max(.12, Math.min(.88, ((x - A.x) * dx + (y - A.y) * dy) / (dx * dx + dy * dy)));
    const px = A.x + dx * t, py = A.y + dy * t, d = Math.hypot(px - x, py - y);
    if (!best || d < best.d) best = { x: px, y: py, d };
  }
  return best;
};
const placeTag = document.createElement("div"); placeTag.className = "tag place"; tagsEl.appendChild(placeTag);
function placeTags() {
  const showStreets = cam.z >= 1.6, bottom = visibleH() - 10;
  // aim a little off Claire and the centre so tags do not sit on top of her
  const ax = cam.x + 60, ay = cam.y - 40;
  const car = toScreen(me.x, me.y), shown = [{ x: car.x, y: car.y }];   // never cover the car
  for (const s of streetTags) {
    const n = nearestOnRoad(s.pts, ax, ay), p = toScreen(n.x, n.y);
    const ok = showStreets && p.y < bottom && p.y > (DUO ? 70 : 100) && p.x > 40 && p.x < SCREEN_W - SIDE - 70 && shown.every(q => Math.abs(q.x - p.x) > 90 || Math.abs(q.y - p.y) > 22);
    if (ok) shown.push(p);
    s.t.style.left = Math.round(p.x) + "px"; s.t.style.top = Math.round(p.y) + "px"; s.t.style.opacity = ok ? 1 : 0;
  }
  if (selected) {
    const p = toScreen(selected.at[0], selected.at[1] + selected.size[1] + 4);
    placeTag.textContent = selected.name.toUpperCase(); placeTag.style.left = Math.round(p.x) + "px"; placeTag.style.top = Math.round(p.y) + "px";
    placeTag.style.opacity = p.y < bottom - 14 ? 1 : 0;
  } else placeTag.style.opacity = 0;
}

/* =====================================================================
   Sheet: search + Recents / Places, and a place card. Picking a place previews
   the way there; travel itself is not hooked up yet.
   ===================================================================== */
const $ = id => document.getElementById(id);
const EMBED = new URLSearchParams(location.search).has("embed");
const list = $("list"), q = $("q");
let tab = "recent", sheetState = "peek";
let recents = [];
try { recents = JSON.parse(localStorage.getItem("butterland-recents") || "null") || []; } catch (e) {}
if (!recents.length) recents = [{ id:"smile", t: Date.now() - 7 * 864e5 }, { id:"lab", t: Date.now() - 6 * 864e5 }, { id:"cafe", t: Date.now() - 864e5 }];
const saveRecents = () => { try { localStorage.setItem("butterland-recents", JSON.stringify(recents.slice(-20))); } catch (e) {} };
const ago = t => { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? "TODAY" : d === 1 ? "YESTERDAY" : d < 7 ? `${d} DAYS AGO` : d < 14 ? "1 WEEK AGO" : `${Math.floor(d / 7)} WEEKS AGO`; };
const PIN_ICON = `<svg viewBox="0 0 7 9" fill="#222d35"><rect x="1" y="0" width="5" height="1"/><rect x="0" y="1" width="7" height="4"/><rect x="1" y="5" width="5" height="1"/><rect x="2" y="6" width="3" height="1"/><rect x="3" y="7" width="1" height="2"/><rect x="2" y="2" width="3" height="2" fill="#fffde6"/></svg>`;
const itemHTML = p => `<button class="item" data-id="${p.id}"><div class="txt"><div class="name">${p.name}</div><div class="addr">${p.addr}</div></div><div class="chip">${PIN_ICON}<span>${fmtMi(route(me, { x: p.at[0], y: p.at[1] }).len)}</span></div></button>`;
function renderList() {
  const term = q.value.trim().toLowerCase();
  let html = "";
  if (term) {
    const hits = PLACES.filter(p => (p.name + " " + p.addr + " " + p.tag).toLowerCase().includes(term));
    html = hits.length ? hits.map(itemHTML).join("") : `<div class="empty">NOTHING CALLED<br>"${q.value.trim().toUpperCase()}"</div>`;
  } else html = PLACES.filter(p => p.id !== "home").map(itemHTML).join("");   // one plain list of places around town
  list.innerHTML = html;
}
list.addEventListener("click", e => { const b = e.target.closest(".item"); if (b) select(b.dataset.id); });
const setTab = t => { tab = t; $("tabRecent").classList.toggle("on", t === "recent"); $("tabPlaces").classList.toggle("on", t === "places"); renderList(); };
$("tabRecent").onclick = () => setTab("recent");
$("tabPlaces").onclick = () => setTab("places");
q.addEventListener("focus", () => setSheet("full"));
q.addEventListener("input", renderList);
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = list.querySelector(".item"); if (first) select(first.dataset.id); }
  if (e.key === "Escape") { q.value = ""; q.blur(); renderList(); setSheet("peek"); }
});
function setSheet(state) {
  sheetState = state;
  sheet.classList.toggle("full", state === "full"); sheet.classList.toggle("card", state === "card");
  $("browse").hidden = state === "card"; $("card").hidden = state !== "card";
  const t0 = performance.now(); const keep = now => { draw(); if (now - t0 < 360) requestAnimationFrame(keep); }; requestAnimationFrame(keep);
}
$("grab").onclick = () => { if (sheetState === "peek") setSheet("full"); else if (sheetState === "full") { q.blur(); setSheet("peek"); } };

function select(id) {
  selected = byId[id]; q.blur();
  const r = route(me, { x: selected.at[0], y: selected.at[1] }); lastRoute = r;
  paintRoute(miles(r.len) < .05 ? null : r);
  $("cName").textContent = selected.name.toUpperCase();
  $("cAddr").textContent = selected.addr.toUpperCase();
  $("cDist").textContent = fmtMi(r.len);
  $("cTime").textContent = miles(r.len) < .05 ? "—" : `${minutes(r.len)} MIN`;
  $("cTag").textContent = selected.tag.toUpperCase();
  recents.push({ id, t: Date.now() }); saveRecents();
  setSheet("card");
  setTimeout(() => fit([...r.pts, { x: selected.at[0], y: selected.at[1] - 40 }]), 20);
}
function clearSelection() {
  selected = null; paintRoute(null); setSheet("peek"); renderList();
  setTimeout(() => flyTo(me.x, me.y, 2), 20);
}
$("cClose").onclick = clearSelection;

/* ---------- top controls ---------- */
/* ---------- the car: 1% battery, not enough to drive anywhere ---------- */
const BATTERY = 1, RANGE_UNITS = .1 / MI_PER_UNIT;   // 0.1 mi
let lastRoute = null;
$("goBtn").onclick = () => {
  if (!selected) return;
  const need = lastRoute ? fmtMi(lastRoute.len) : "";
  $("mText").innerHTML = lastRoute && miles(lastRoute.len) >= .05
    ? `YOUR TESLA IS AT ${BATTERY}%<br>(0.1 MI OF RANGE).<br>${selected.name.toUpperCase()} IS ${need} AWAY.<br>PLUG IN AT HOME FIRST.`
    : `YOUR TESLA IS AT ${BATTERY}%.<br>IT'S ALREADY PARKED HERE.`;
  const m = $("modal"); m.classList.add("show");
  if (EMBED) parent.postMessage({ type: "tesla-drive" }, "*");   // the game shows its TESLA notice
  const panel = m.querySelector(".panel"); panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
  $("mOk").focus();
};
$("mOk").onclick = () => $("modal").classList.remove("show");
$("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").classList.remove("show"); });
$("back").onclick = () => {
  if (selected) clearSelection();
  else if (sheetState === "full") { q.value = ""; q.blur(); renderList(); setSheet("peek"); }
  else if (EMBED) closePhone();
  else toast("YOU'RE ON THE MAP");
};
$("recenter").onclick = () => flyTo(me.x, me.y, Math.max(2, Math.round(cam.z)));
$("mode").onclick = () => { night = !night; $("mode").classList.toggle("on", night); draw(); toast(night ? "NIGHT MAP" : "DAY MAP"); };
$("pinsBtn").onclick = () => {
  showAll = !showAll; $("pinsBtn").classList.toggle("on", showAll);
  if (showAll && !selected) fit(PLACES.map(p => ({ x: p.at[0], y: p.at[1] })));
  draw(); toast(showAll ? "ALL PLACES SHOWN" : "PINS HIDDEN");
};
$("share").onclick = () => toast("CAR LOCATION SENT. MEOW!");
let toastT = 0;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600); }

/* ---------- clock, scale to fit, start ---------- */
const tickClock = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }).replace(/\s?[AP]M/i, ""); };
tickClock(); setInterval(tickClock, 15000);
function fitPhone() {
  if (DUO) {
    // A touch bigger than the game's screen and sitting a little low, so the shell runs off the edges.
    phoneScale = Math.min(innerWidth / 536, innerHeight / 408) * .98;
    const x = (innerWidth - 536 * phoneScale) / 2, y = (innerHeight - 408 * phoneScale) / 2 + innerHeight * .07;
    $("phone").style.transform = `translate(${x}px, ${y}px) scale(${phoneScale})`;
  } else {
    phoneScale = Math.min(innerWidth * .94 / 414, innerHeight * .94 / 590);
    $("phone").style.transform = `scale(${phoneScale})`;
  }
  sizeCanvas(); draw();
}
addEventListener("resize", fitPhone);
$("screen").addEventListener("scroll", e => { e.currentTarget.scrollTop = 0; e.currentTarget.scrollLeft = 0; });
fitPhone(); renderList();
document.fonts?.ready.then(draw);
setTimeout(() => flyTo(me.x, me.y, 2, 800), 800);

/* ---------- inside the game: transparent page, and ways to put the phone away ---------- */
function closePhone() { $("modal").classList.remove("show"); parent.postMessage({ type: "phone-close" }, "*"); }
if (EMBED) {
  document.body.classList.add("embed");
  document.querySelector(".stage").addEventListener("click", e => { if (!e.target.closest(".phone")) closePhone(); });
}
addEventListener("keydown", e => {
  // On the bottom screen the game's B (Z) and Y (A) keys put the phone away too, unless typing a search.
  if (DUO && EMBED && document.activeElement !== q && /^[za]$/i.test(e.key)) { closePhone(); return; }
  if (e.key !== "Escape") return;
  if ($("modal").classList.contains("show")) $("modal").classList.remove("show");
  else if (EMBED && document.activeElement !== q) closePhone();
});
})();
</script>
</body>
</html>
