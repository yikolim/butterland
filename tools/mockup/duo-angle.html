<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Butterland on iPhone Duo</title>
<!-- A product shot of Butterland on an iPhone Duo, opened like a clamshell and tipped toward the
     camera so the bottom screen shows more. The bottom screen is the live game (playable); the top
     screen mirrors the same game's top canvas. Serve the project root (pages-site) and open
     /tools/mockup/duo-angle.html. -->
<style>
:root{
  --W:600px;--H:370px;          /* one half of the Duo layout, as the game draws it */
  --open:0deg;                  /* how far the bottom half folds out from the top half's plane */
  --tilt:0deg;                  /* the whole device leans back, so the top screen faces up a little */
  --eye:-20%;--persp:4200px;    /* camera a little above, far enough back to keep edges straight */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#d2d6de;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif}

/* The backdrop: soft aqua and periwinkle clouds (aqua.png), blurred just enough to smooth out
   its grain. */
.room{position:fixed;inset:0;overflow:hidden;background:#bfeefc}
.room::before{content:"";position:absolute;inset:-80px;background:url(aqua.png) center/100% 100% no-repeat;filter:blur(30px)}

/* The device. */
.scene{position:absolute;left:50%;top:50%;width:var(--W);height:0;perspective:var(--persp,3200px);perspective-origin:50% var(--eye,-30%);
  transform:translate(-50%,0) scale(var(--k,1));transform-origin:50% 0}
.duo{position:absolute;left:0;top:0;width:var(--W);transform-style:preserve-3d;transform:rotateX(var(--tilt))}
.half{position:absolute;left:0;width:var(--W);height:var(--H);transform-style:preserve-3d}
.half.top{bottom:0;transform-origin:50% 100%;transform:rotateX(var(--lean,0deg))}
.half.bot{top:0;transform-origin:50% 0;transform:rotateX(var(--open))}
/* the iPhone Duo's own case: one thin pale frosted shell around both halves, a shade off the backdrop */
.case{position:absolute;left:-9px;right:-9px;top:calc(-1 * var(--H) - 9px);height:calc(2 * var(--H) + 18px);border-radius:44px;
  background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.38),inset 0 2px 0 rgba(255,255,255,.3),0 1px 2px rgba(60,80,120,.08)}
/* The two halves meet flush at the fold, so nothing shows between the screens. */
.slab{position:absolute;inset:-4px;border-radius:35px;
  background:linear-gradient(180deg,#eccfd0,#dcbcbe 50%,#cfb0b3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.glass{position:absolute;inset:0;border-radius:31px;overflow:hidden;background:#e8c9cb}
.top .slab{bottom:0;border-radius:35px 35px 0 0}.bot .slab{top:0;border-radius:0 0 35px 35px}
.top .glass,.top .glare{border-radius:31px 31px 0 0}.bot .glass,.bot .glare{border-radius:0 0 31px 31px}
.glass iframe{position:absolute;left:0;width:600px;height:750px;border:0;display:block}
.top .glass iframe{top:0;pointer-events:none}
.bot .glass iframe{top:-380px}
/* light on the glass */
.glare{position:absolute;inset:0;border-radius:31px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 28%,transparent 42%,transparent 70%,rgba(255,255,255,.06) 100%)}
.bot .glare{background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 35%,transparent 80%,rgba(0,0,0,.08))}
.shadow{position:absolute;left:-60px;right:-60px;top:calc(var(--H) * .78);height:90px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,70,110,.30),rgba(60,70,110,.10) 60%,transparent);filter:blur(10px);
  transform:translateY(40px)}
</style>
</head>
<body>
<div class="room"></div>
<div class="scene" id="scene">
  <div class="shadow"></div>
  <div class="duo">
    <div class="case"></div>
    <div class="half top"><div class="slab"></div><div class="glass"><iframe id="mirror" tabindex="-1" title="Top screen"></iframe></div><div class="glare"></div></div>
    <div class="half bot"><div class="slab"></div><div class="glass"><iframe id="game" title="Butterland"></iframe></div><div class="glare"></div></div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);
const src=q.get("src")||"/site/?duo&debug";   // ?debug exposes window.__cart, which the demo below drives
const game=document.getElementById("game"),mirror=document.getElementById("mirror");
game.src=src;mirror.src=src;

// Fit the shot to the window, with room around the device for the backdrop.
function fit(){const k=Math.min(innerWidth/1000,innerHeight/960);document.getElementById("scene").style.setProperty("--k",k)}
addEventListener("resize",fit);fit();

// The game draws its own hinge strip (L / R and a dark bar) across the fold; hide it in both
// copies, and paint the page behind the panels shell pink so their rounded corners blend in.
// Checked every frame, so it also holds if a page reloads.
function cleanFold(f){
  try{
    const doc=f.contentDocument;
    if(!doc||!doc.head||doc.getElementById("mockup-fold"))return;
    const st=doc.createElement("style");st.id="mockup-fold";
    st.textContent="#hinge{display:none!important}html,body,#stage,#ds{background:#efc9cb!important}";
    doc.head.append(st);
  }catch(e){}
}

// The top screen shows the playable game's top canvas, drawn over a quiet copy of the page.
let live=null,copy=null;
function hook(){
  try{
    live=game.contentDocument.getElementById("top");
    const doc=mirror.contentDocument,t=doc.getElementById("top");
    if(!live||!t)return false;
    // Same id, so the shell's #top sizing applies and the picture keeps its shape.
    copy=doc.createElement("canvas");copy.width=live.width;copy.height=live.height;
    t.replaceWith(copy);copy.id="top";
    doc.querySelectorAll("audio").forEach(a=>{a.muted=true});
    return true;
  }catch(e){return false}
}
function loop(){
  cleanFold(game);cleanFold(mirror);
  if(!copy){hook()}
  else if(live){
    if(copy.width!==live.width||copy.height!==live.height){copy.width=live.width;copy.height=live.height}
    const g=copy.getContext("2d");g.imageSmoothingEnabled=false;g.drawImage(live,0,0);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
game.addEventListener("load",()=>game.focus());

// Demo: pressing PLAY on the title runs the delivery story without the cat hunt. It opens on the
// truck cutscene (every cat already found), then Claire steps out of the house, walks down to
// the package by the gate, opens it and unboxes the iPhone Duo.
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cart=()=>game.contentWindow&&game.contentWindow.__cart;
const state=()=>cart().state();
function key(code,type){const w=game.contentWindow;w.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}))}
async function tap(code){key(code,"keydown");await sleep(90);key(code,"keyup")}
async function until(test,ms){const end=Date.now()+ms;while(Date.now()<end){if(test())return true;await sleep(100)}return false}
async function demo(){
  cart().truck();
  await until(()=>state().scene==="inside"&&state().delivery==="waiting",30000);   // the cutscene ends
  await sleep(2600);                                    // NEW PACKAGE! notice
  cart().leave();
  await until(()=>state().scene==="outside",3000);await sleep(700);
  key("ArrowDown","keydown");                           // down the path to the gate
  await until(()=>state().out.y>=81,3000);
  key("ArrowDown","keyup");await sleep(400);
  // Pick it up and answer YES (the default) to opening it here.
  const stop=Date.now()+15000;
  while(state().delivery==="waiting"&&Date.now()<stop){await tap("KeyX");await sleep(1100)}
}
let last=null,ran=false;
setInterval(()=>{
  let s;try{s=cart()&&state()}catch(e){return}
  if(!s)return;
  if(!ran&&last==="title"&&s.scene==="outside"&&s.delivery!=="unboxing"){ran=true;demo()}   // PLAY lands in the yard
  last=s.scene;
},150);
</script>
</body>
</html>
